                      $ref: '#/components/schemas/Wallet'
    post:
      tags:
        - wallets
      summary: Register a new settlement wallet (issues challenge)
      description: >-
        Creates the wallet row in `unverified` state and returns a one-time challenge. Sign the
        challenge with the wallet's key, then POST to `/wallets/{id}/verify` with the signature.
        Step-up auth required.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
