                      $ref: '#/components/schemas/WebhookEndpoint'
    post:
      tags:
        - webhooks
      summary: Register a webhook endpoint
      description: >-
        The `signingSecret` is returned exactly once. Verify webhook payloads by HMAC-SHA256 of
        `${timestamp}.${body}` against this secret; the signature header is `x-opensettle-signature:
        t=…,v1=…`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                description:
                  type: string
                events:
                  type: array
                  items:
                    type: string
                  description: '`["*"]` for all events'
      responses:
        '201':
          description: Endpoint registered; signingSecret revealed once
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoint:
                    $ref: '#/components/schemas/WebhookEndpoint'
                  signingSecret:
                    type: string
                    example: whsec_…
        '400':
          description: URL must be HTTPS and not point at private/loopback IPs (SSRF guard)
