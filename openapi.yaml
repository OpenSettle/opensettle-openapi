  /v1/workspaces/{workspaceId}/payments/{paymentId}/refund:
    post:
      tags:
        - payments
      summary: Initiate a non-custodial refund
      description: >-
        Returns an unsigned tx envelope that the merchant signs from their own wallet. OpenSettle
        never moves funds. The refund only takes effect when the chain reader observes the signed tx
        via `attachRefundTx` after confirmations.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amountMinor:
                  type: integer
                  description: Defaults to full amount
                reason:
                  type: string
                  nullable: true
                recipientAddress:
                  type: string
                  description: >-
                    Required when not captured at payment time. Strict per-chain validation:
                    cross-chain (e.g. EVM address on Solana payment) is refused.
      responses:
        '200':
          description: Refund initiated; sign + broadcast envelope returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment:
                    $ref: '#/components/schemas/Payment'
                  unsignedTx:
                    type: object
        '400':
          description: Recipient invalid for this chain
        '403':
          description: Admin role required
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Refund already in progress
  /v1/workspaces/{workspaceId}/webhook_endpoints:
    get:
