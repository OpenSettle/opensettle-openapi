      summary: Re-enqueue a specific delivery
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: endpointId
          in: path
          required: true
          schema:
            type: string
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Re-enqueued; worker will retry on next tick
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery:
                    $ref: '#/components/schemas/WebhookDelivery'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Cannot replay against a disabled endpoint
