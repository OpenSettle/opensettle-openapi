openapi: 3.1.0
info:
  title: OpenSettle API
  version: 1.0.0
  description: >-
    Non-custodial Web3 payments API. Stablecoin settlement on Base / Ethereum / Polygon / Arbitrum
    (EVM), plus Solana and Tron. Authenticate with a workspace-scoped Bearer API key (`sk_live_...`
    or `sk_test_...`). All money amounts are minor units (cents). All times are ISO-8601 UTC
    strings.
  contact:
    name: OpenSettle
    url: https://opensettle.io
servers:
  - url: https://api.opensettle.io
security:
  - bearerAuth: []
tags:
  - name: customers
    description: Customers attached to a workspace
  - name: products
    description: Products + recurring/one-time prices
  - name: subscriptions
    description: Recurring billing
  - name: invoices
    description: One-off + subscription invoices
  - name: payments
    description: On-chain payment records + refunds
  - name: webhooks
    description: Endpoint registration + event replay
  - name: checkouts
    description: Hosted payment sessions
  - name: wallets
    description: Merchant settlement wallets (verify required)
  - name: health
    description: Liveness + readiness probes
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sk_{live|test}_…
      description: >-
        Workspace-scoped API key. The key's scope determines which workspace it operates against;
        the URL `:workspaceId` must match. Permissions: `readonly` → viewer, `restricted` →
        developer, `full` → admin.
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: invalid_request
        message:
          type: string
          example: Idempotency-Key header is required on this endpoint
        param:
          type: string
          nullable: true
          example: Idempotency-Key
    ErrorEnvelope:
      type: object
      required:
        - error
        - requestId
      properties:
        error:
          $ref: '#/components/schemas/Error'
        requestId:
          type: string
          example: req_01HZ…
    Customer:
      type: object
      properties:
        id:
          type: string
          example: cus_01HZ…
        workspaceId:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        wallet:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - deleted
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
    Payment:
      type: object
      properties:
        id:
          type: string
          example: pay_01HZ…
        workspaceId:
          type: string
        customerId:
          type: string
          nullable: true
        walletId:
          type: string
          nullable: true
        amountMinor:
          type: integer
          description: USD cents
        feeMinor:
          type: integer
        netMinor:
          type: integer
        currency:
          type: string
          example: USD
        token:
          type: string
          enum:
            - USDC
            - USDT
        chain:
          type: string
          enum:
            - base
            - ethereum
            - polygon
            - arbitrum
            - solana
            - tron
        status:
          type: string
          enum:
            - pending
            - confirmed
            - failed
            - refunded
        txHash:
          type: string
          nullable: true
        confirmations:
          type: integer
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    WebhookEndpoint:
      type: object
      properties:
        id:
          type: string
        workspaceId:
          type: string
        url:
          type: string
          format: uri
        description:
          type: string
          nullable: true
        events:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - enabled
            - disabled
        successRate:
          type: number
        createdAt:
          type: string
          format: date-time
    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
        eventId:
          type: string
        eventType:
          type: string
        status:
          type: string
          enum:
            - pending
            - delivering
            - succeeded
            - failed
            - dead
        attemptCount:
          type: integer
        httpStatus:
          type: integer
          nullable: true
        lastError:
          type: string
          nullable: true
        latencyMs:
          type: integer
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    PaginatedList:
      type: object
      properties:
        data:
          type: array
          items: {}
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true
    ChainId:
      type: string
      enum:
        - base
        - ethereum
        - polygon
        - arbitrum
        - solana
        - tron
    TokenSymbol:
      type: string
      enum:
        - USDC
        - USDT
    Product:
      type: object
      properties:
        id:
          type: string
          example: prod_01HZ…
        workspaceId:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        active:
          type: boolean
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    Price:
      type: object
      properties:
        id:
          type: string
          example: price_01HZ…
        workspaceId:
          type: string
        productId:
          type: string
        amount:
          type: integer
          description: Minor units (cents)
        currency:
          type: string
          example: USD
        interval:
          type: string
          enum:
            - one_time
            - week
            - month
            - year
        active:
          type: boolean
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    LineItem:
      type: object
      required:
        - description
        - quantity
        - unitAmountMinor
      properties:
        description:
          type: string
          maxLength: 200
        quantity:
          type: integer
          minimum: 1
        unitAmountMinor:
          type: integer
    Invoice:
      type: object
      properties:
        id:
          type: string
          example: inv_01HZ…
        workspaceId:
          type: string
        number:
          type: string
          description: Human-readable, monotonic per workspace
        customerId:
          type: string
        subscriptionId:
          type: string
          nullable: true
        amountMinor:
          type: integer
        currency:
          type: string
        chain:
          $ref: '#/components/schemas/ChainId'
        token:
          $ref: '#/components/schemas/TokenSymbol'
        status:
          type: string
          enum:
            - draft
            - open
            - paid
            - past_due
            - void
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
        memo:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
    Subscription:
      type: object
      properties:
        id:
          type: string
          example: sub_01HZ…
        workspaceId:
          type: string
        customerId:
          type: string
        productId:
          type: string
        priceId:
          type: string
        amountMinor:
          type: integer
        currency:
          type: string
        chain:
          $ref: '#/components/schemas/ChainId'
        token:
          $ref: '#/components/schemas/TokenSymbol'
        status:
          type: string
          enum:
            - active
            - past_due
            - paused
            - canceled
        autopay:
          type: string
          enum:
            - allowance
            - smart-wallet
            - manual
        allowanceTx:
          type: string
          nullable: true
        allowanceRemaining:
          type: integer
          nullable: true
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
        currentPeriodEnd:
          type: string
          format: date-time
        nextBillingDate:
          type: string
          format: date-time
        canceledAt:
          type: string
          format: date-time
          nullable: true
        cancelReason:
          type: string
          nullable: true
        pausedAt:
          type: string
          format: date-time
          nullable: true
        mrrMinor:
          type: integer
        createdAt:
          type: string
          format: date-time
    Checkout:
      type: object
      properties:
        id:
          type: string
          example: co_01HZ…
        workspaceId:
          type: string
        mode:
          type: string
          enum:
            - payment
            - subscription
        status:
          type: string
          enum:
            - open
            - pending
            - succeeded
            - failed
            - expired
        customerId:
          type: string
        invoiceId:
          type: string
          nullable: true
        priceId:
          type: string
          nullable: true
        amountMinor:
          type: integer
        currency:
          type: string
        chain:
          $ref: '#/components/schemas/ChainId'
        token:
          $ref: '#/components/schemas/TokenSymbol'
        description:
          type: string
          nullable: true
        successUrl:
          type: string
          format: uri
        cancelUrl:
          type: string
          format: uri
          nullable: true
        expiresAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    Wallet:
      type: object
      properties:
        id:
          type: string
          example: wlt_01HZ…
        workspaceId:
          type: string
        chain:
          $ref: '#/components/schemas/ChainId'
        token:
          $ref: '#/components/schemas/TokenSymbol'
        address:
          type: string
          description: EIP-55 checksum for EVM, base58 32-byte for Solana, base58check `T…` for Tron.
        nickname:
          type: string
        verified:
          type: boolean
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        isDefault:
          type: boolean
        balance:
          type: integer
          description: Cached, may be stale
        createdAt:
          type: string
          format: date-time
    WalletChallenge:
      type: object
      required:
        - id
        - message
        - expiresAt
      properties:
        id:
          type: string
          example: wch_01HZ…
        message:
          type: string
          description: >-
            Multi-line UTF-8 challenge. Wallet must sign these exact bytes; tampering rotates the
            verifier into rejection.
        expiresAt:
          type: string
          format: date-time
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated but lacks required role / workspace scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource doesn't exist or isn't visible in this workspace
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Too many requests — see `Retry-After` header
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds
    BadRequest:
      description: 'Validation failure (`code: invalid_request`) — `param` points at the offending field.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 'State conflict (`code: conflict`) — usually a uniqueness collision.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidStateTransition:
      description: >-
        Resource is in a state where the requested operation isn't legal (`code:
        invalid_state_transition`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AalRequired:
      description: >-
        Step-up required (`code: aal_required`). Re-authenticate with a recent factor (within 5 min)
        or upgrade the session to AAL=2 with a passkey assertion, then retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: >-
        Required on every money-adjacent POST. Replaying with the same key returns the original
        response byte-for-byte. Different body + same key → 409.
paths:
  /v1/healthz:
    get:
      tags:
        - health
      summary: Liveness probe (public)
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /v1/readyz:
    get:
      tags:
        - health
      summary: Readiness probe (public)
      description: >-
        Verifies DB connectivity. Used by Fly health checks. Body intentionally omits the session
        count value to avoid leaking deployment volume to public probes.
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  db:
                    type: string
                    enum:
                      - ok
                  checks:
                    type: object
                  elapsed_ms:
                    type: integer
        '503':
          description: DB unreachable
  /v1/workspaces/{workspaceId}/customers:
    get:
      tags:
        - customers
      summary: List customers
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - deleted
        - name: q
          in: query
          schema:
            type: string
          description: Substring match on email or name
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Page of customers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - customers
      summary: Create a customer
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                wallet:
                  type: string
                  nullable: true
                country:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Customer with that email already exists
  /v1/workspaces/{workspaceId}/customers/{customerId}:
    get:
      tags:
        - customers
      summary: Retrieve a customer
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - customers
      summary: Update a customer
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                wallet:
                  type: string
                  nullable: true
                country:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - customers
      summary: Soft-delete a customer (PII scrubbed; references preserved)
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/workspaces/{workspaceId}/products:
    get:
      tags:
        - products
      summary: List products
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: active
          in: query
          schema:
            type: boolean
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Page of products
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
    post:
      tags:
        - products
      summary: Create a product
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 1000
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/workspaces/{workspaceId}/products/{productId}:
    get:
      tags:
        - products
      summary: Retrieve a product
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - products
      summary: Update a product
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true
                active:
                  type: boolean
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
  /v1/workspaces/{workspaceId}/products/{productId}/prices:
    get:
      tags:
        - products
      summary: List prices for a product
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Prices
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Price'
    post:
      tags:
        - products
      summary: Create a price for a product
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - currency
                - interval
              properties:
                amount:
                  type: integer
                  minimum: 0
                currency:
                  type: string
                  example: USD
                interval:
                  type: string
                  enum:
                    - one_time
                    - week
                    - month
                    - year
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price'
  /v1/workspaces/{workspaceId}/prices/{priceId}:
    patch:
      tags:
        - products
      summary: Archive (or unarchive) a price
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: priceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price'
  /v1/workspaces/{workspaceId}/invoices:
    get:
      tags:
        - invoices
      summary: List invoices
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: customerId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - draft
              - open
              - paid
              - past_due
              - void
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Page of invoices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Invoice'
    post:
      tags:
        - invoices
      summary: Create an invoice
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customerId
                - amountMinor
                - currency
                - chain
                - token
                - lineItems
              properties:
                customerId:
                  type: string
                amountMinor:
                  type: integer
                  minimum: 1
                currency:
                  type: string
                  minLength: 3
                  maxLength: 3
                chain:
                  $ref: '#/components/schemas/ChainId'
                token:
                  $ref: '#/components/schemas/TokenSymbol'
                lineItems:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/LineItem'
                memo:
                  type: string
                  maxLength: 500
                dueAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/workspaces/{workspaceId}/invoices/{invoiceId}:
    get:
      tags:
        - invoices
