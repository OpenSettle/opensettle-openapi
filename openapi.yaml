  /v1/workspaces/{workspaceId}/wallets/{walletId}/verify:
    post:
      tags:
        - wallets
      summary: Submit a signed challenge to verify wallet ownership
      description: >-
        Signature wire-formats per chain — EVM: `0x…` ERC-191 personal-sign hex; Solana: base58
        Ed25519 (64 bytes); Tron: `0x…` TIP-191 hex. Challenge is consumed atomically before
        signature verify, so a replay can't succeed even if you POST the same nonce twice. Step-up
        auth required.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: walletId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - challengeId
                - signature
              properties:
                challengeId:
                  type: string
                signature:
                  type: string
      responses:
        '200':
          description: Wallet verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet:
                    $ref: '#/components/schemas/Wallet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AalRequired'
