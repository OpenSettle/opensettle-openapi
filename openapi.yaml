                  type: string
                  maxLength: 80
      responses:
        '201':
          description: Wallet created with one-shot signing challenge
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet:
                    $ref: '#/components/schemas/Wallet'
                  challenge:
                    $ref: '#/components/schemas/WalletChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
